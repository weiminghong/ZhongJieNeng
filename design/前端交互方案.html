<script>
"use strict";
const DATA=JSON.parse(document.getElementById("snapshot").textContent);
const S={page:"compare",station:"lanneng",mode:"operate",cutoff:14,start:0,end:96,selected:50,detail:"source",query:"",quality:"all",pageIndex:8,feedback:[],drafts:{},version:"corrected",show:{actual:true,forecast:true,corrected:true},step:0};
const $=id=>document.getElementById(id);
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=x=>x===null||x===undefined?"—":Number(x).toFixed(2);
const fmt=i=>String(Math.floor(i/4)).padStart(2,"0")+":"+String(i%4*15).padStart(2,"0");
const local=x=>x?new Date(x).toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",hour12:false}).replaceAll("/","-"):"—";
function cutoff(hour){return new Date("2026-11-20T"+String(hour).padStart(2,"0")+":00:00+08:00").toISOString();}
function station(){return DATA.stations.find(x=>x.id===S.station);}
function rows(){
 const forecastCut=cutoff(S.cutoff),observedCut=cutoff(S.mode==="review"?14:S.cutoff);
 return station().rows.map((r,i)=>({...r,i,actual:r.arrived&&r.arrived<=observedCut?r.actual:null,forecast:r.published<=forecastCut?r.forecast:null,corrected:r.correctedAt&&r.correctedAt<=forecastCut?r.corrected:null,due:r.end<=observedCut}));
}
function filtered(){
 return rows().filter(r=>r.i>=S.start&&r.i<S.end).filter(r=>!S.query||[fmt(r.i),r.due?(r.actual===null?"缺测":"已到数"):"待实测",r.recordId||""].join(" ").includes(S.query)).filter(r=>S.quality==="all"||(S.quality==="missing"?r.due&&r.actual===null:S.quality==="pending"?!r.due:r.actual!==null));
}
function paired(){
 return filtered().filter(r=>r.actual!==null&&r.forecast!==null&&(S.version==="corrected"?r.corrected!==null:true));
}
function metrics(key,pool){return pool.length?pool.reduce((a,r)=>a+Math.abs(r[key]-r.actual),0)/pool.length:null;}
function summary(){const pool=paired();return {pool,a:metrics("forecast",pool),b:S.version==="corrected"?metrics("corrected",pool):null};}
function draftKey(){return S.station+":"+S.selected;}
function notice(text){$("global-message").innerHTML='<div class="toast">'+esc(text)+"</div>";}
function rowStatus(r){return !r.due?"待实测":r.actual===null?"缺测":"已到数";}
function unit(x){return num(x)+' <span class="small muted">MW</span>';}
function metric(label,value,note){return '<div class="metric"><span>'+label+'</span><strong>'+value+'</strong><span>'+note+"</span></div>";}
function options(){let a="";for(let i=0;i<=96;i++)a+='<option value="'+i+'">'+fmt(i)+"</option>";return a;}
function render(){
 const titles={compare:"预测工作台",raw:"原始数据",models:"模型与反馈",design:"交互与实施说明"};
 document.querySelectorAll("[data-page]").forEach(b=>{b.classList.toggle("active",b.dataset.page===S.page);if(b.dataset.page===S.page)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
 $("cutoff").disabled=S.mode==="operate";$("cutoff").value=S.cutoff;$("mode").value=S.mode;
 $("cutoff-label").textContent=S.mode==="review"?"预测可见截止 · 北京时间":"数据截止 · 北京时间";
 $("mode-note").textContent=S.mode==="operate"?"日内运行：本稿演示时钟固定为 11 月 20 日 14:00，展示该时点已到达的实测与已发布预测。":S.mode==="replay"?"历史回放：预测、修正和实测都受所选截止时间约束；不可见版本明确标注“尚未发布”。":"事后复盘：预测固定在所选截止时间，实绩独立截至 14:00。实绩仅用于评价，不作为此前预测的输入。";
 if(S.page==="compare")renderCompare();else if(S.page==="raw")renderRaw();else if(S.page==="models")renderModels();else renderDesign();
}
function renderCompare(){
 const m=summary(),visible=filtered(),due=visible.filter(r=>r.due).length,actual=visible.filter(r=>r.actual!==null).length;
 const updated=rows().some(r=>r.corrected!==null);
 const reason=S.version==="corrected"&&!updated?"日内 10:00 版本在当前时点尚未发布。":m.pool.length?"样本数会随时间范围和版本可见性共同变化。":"当前范围没有有效配对样本，误差保持为空。";
 const delta=m.a!==null&&m.b!==null?m.b-m.a:null;
 $("content").innerHTML='<section class="panel"><div class="panel-head"><h2>功率预测 · 同样本对比</h2><span class="tag">已到数 '+actual+" / "+due+'</span></div><div class="pad"><div class="pair"><label class="field"><span>版本 A · 基线</span><select id="baseline"><option>日前预测 · 前一日 09:00</option></select></label><span class="versus">对比</span><label class="field"><span>版本 B · 比较对象</span><select id="version"><option value="corrected">日内修正 · 当日 10:00'+(!updated?"（尚未发布）":"")+'</option><option value="none">仅查看日前预测</option></select></label></div><div class="metrics">'+metric("同样本时段",m.pool.length+' <span class="small muted">个</span>',S.version==="corrected"?"A、B 和实绩同时有效":"A 和实绩同时有效")+metric("版本 A · MAE",unit(m.a),"日前预测")+metric("版本 B · MAE",unit(m.b),"日内 10:00 修正")+metric("B − A · MAE",delta===null?"—":(delta>0?"+":"")+num(delta),"负值表示本次误差更小")+'</div><p class="small muted" style="margin:12px 0 0">'+reason+'</p></div><div class="selection">比较类型：日前与日内滚动。两者使用的信息不同，本稿结果只说明合成场景中的修正表现。</div></section><div class="work-grid"><div><section class="panel"><div class="panel-head"><h2>预测曲线与实绩</h2><button class="small" data-action="worst">定位最大偏差</button></div><div class="legend">'+["forecast","corrected","actual"].map((k,i)=>'<label><input type="checkbox" data-line="'+k+'" '+(S.show[k]?"checked":"")+'><span class="dot '+["a","b","c"][i]+'"></span>'+["日前预测","日内修正","实际出力"][i]+"</label>").join("")+'</div><div class="chart" id="chart"></div><div class="range"><span class="small muted">分析范围</span><select id="range-start" aria-label="开始时段">'+options()+'</select><span>至</span><select id="range-end" aria-label="结束时段">'+options()+'</select><button class="small" data-action="reset-range">全天</button><span class="spacer"></span><button class="small" data-action="agent">分析已选时段</button></div><div class="selection" id="selection"></div></section><section class="panel"><div class="panel-head"><h2>对齐记录</h2><button class="small" data-action="export">导出范围内 '+visible.length+' 条</button></div><div id="table"></div></section></div><section class="panel detail"><div class="panel-head"><h2 id="detail-title">时段详情</h2><span class="tag">同一分析范围</span></div><div class="detail-tabs"><button class="small" data-detail="source">来源</button><button class="small" data-detail="agent">Agent</button><button class="small" data-detail="feedback">人工复核</button></div><div class="pad" id="detail"></div></section></div>';
 $("version").value=S.version;$("range-start").value=S.start;$("range-end").value=S.end;
 renderChart();renderTable();renderDetail();
}
function renderChart(){
 const current=rows().filter(r=>r.i>=S.start&&r.i<S.end),lo=S.start,hi=S.end-1;
 const W=640,H=245,L=38,R=12,T=18,B=35;
 const max=Math.max(20,...current.flatMap(r=>[r.forecast||0,r.corrected||0,r.actual||0]))*1.14;
 const X=i=>L+(i-lo)/Math.max(1,hi-lo)*(W-L-R),Y=v=>H-B-v/max*(H-T-B);
 let svg='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="功率曲线，蓝色虚线为日前预测，橙色点线为日内修正，绿色实线为实绩。可点击数据点定位时段。">';
 for(let n=0;n<=4;n++){let v=n*max/4,y=Y(v);svg+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(v)+"</text>";}
 svg+='<text x="2" y="10">MW</text>';
 const dueCut=(S.mode==="review"?14:S.cutoff)*4;
 if(dueCut>=lo&&dueCut<=hi)svg+='<line x1="'+X(dueCut)+'" x2="'+X(dueCut)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--muted-foreground,#5b7181)" stroke-dasharray="3 5"/><text x="'+Math.min(W-105,X(dueCut)+6)+'" y="'+(T+12)+'">实绩截止 '+fmt(dueCut)+"</text>";
 [["forecast","var(--info,#2876c3)","7 4"],["corrected","var(--warning,#b87b1c)","2 4"],["actual","var(--success,#157d6c)",""]].forEach(([key,color,dash])=>{
 if(!S.show[key]||(key==="corrected"&&S.version!=="corrected"))return;
 let path="",open=false;current.forEach(r=>{if(r[key]===null){open=false;return;}path+=(open?" L":" M")+X(r.i).toFixed(2)+","+Y(r[key]).toFixed(2);open=true;});
 svg+='<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.3" '+(dash?'stroke-dasharray="'+dash+'"':"")+'/>';
 });
 if(S.selected>=lo&&S.selected<=hi){svg+='<line x1="'+X(S.selected)+'" x2="'+X(S.selected)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--primary,#007e78)" opacity=".6"/>';}
 current.forEach(r=>{const v=r.actual??r.forecast;if(v===null)return;svg+='<circle data-index="'+r.i+'" cx="'+X(r.i)+'" cy="'+Y(v)+'" r="'+(S.selected===r.i?5:3)+'" fill="var(--card,#fff)" stroke="'+(r.actual===null?"var(--info,#2876c3)":"var(--success,#157d6c)")+'" stroke-width="'+(S.selected===r.i?3:1)+'" tabindex="0" role="button" aria-label="查看 '+fmt(r.i)+' 时段"><title>'+fmt(r.i)+" · 实发 "+num(r.actual)+" MW · 日前 "+num(r.forecast)+" MW</title></circle>";});
 const stride=Math.max(1,Math.ceil((hi-lo)/6));for(let i=lo;i<=hi;i+=stride)svg+='<text x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle">'+fmt(i)+"</text>";
 svg+="</svg>";$("chart").innerHTML=svg;
 const r=rows()[S.selected];$("selection").textContent="已选 "+fmt(S.selected)+"–"+fmt(S.selected+1)+" · 实发 "+num(r.actual)+" MW · 日前 "+num(r.forecast)+" MW · 修正 "+num(r.corrected)+" MW";
}
function tableMarkup(selected){
 return '<div class="table-wrap"><table><thead><tr><th scope="col">时段</th><th scope="col">实发 MW</th><th scope="col">日前 MW</th><th scope="col">修正 MW</th><th scope="col">状态</th></tr></thead><tbody>'+selected.map(r=>'<tr class="'+(r.i===S.selected?"active":"")+'"><td><button data-select="'+r.i+'">'+fmt(r.i)+"–"+fmt(r.i+1)+"</button></td><td>"+num(r.actual)+"</td><td>"+num(r.forecast)+"</td><td>"+num(r.corrected)+'</td><td><span class="tag '+(r.due&&r.actual===null?"warn":"")+'">'+rowStatus(r)+"</span></td></tr>").join("")+(selected.length?"":'<tr><td colspan="5" style="text-align:center">当前筛选无记录；可清除状态筛选或扩大时间范围。</td></tr>')+"</tbody></table></div>";
}
function renderTable(){
 const list=filtered(),pages=Math.max(1,Math.ceil(list.length/6));S.pageIndex=Math.min(S.pageIndex,pages-1);
 $("table").innerHTML=tableMarkup(list.slice(S.pageIndex*6,S.pageIndex*6+6))+'<div class="pagination"><span class="small muted">'+list.length+" 条 · 第 "+(S.pageIndex+1)+" / "+pages+' 页</span><div class="actions"><button class="small" data-action="prev" '+(S.pageIndex===0?"disabled":"")+'>上一页</button><button class="small" data-action="next" '+(S.pageIndex===pages-1?"disabled":"")+">下一页</button></div></div>";
}
function renderDetail(){
 if(!$("detail"))return;const r=rows()[S.selected];$("detail-title").textContent=fmt(r.i)+"–"+fmt(r.i+1)+" · "+station().name;
 document.querySelectorAll("[data-detail]").forEach(b=>b.classList.toggle("active",b.dataset.detail===S.detail));
 if(S.detail==="source"){
 $("detail").innerHTML='<dl class="facts"><div><dt>业务时段 · 北京时间</dt><dd>'+fmt(r.i)+"–"+fmt(r.i+1)+'</dd></div><div><dt>当前状态</dt><dd>'+rowStatus(r)+'</dd></div><div><dt>日前发布时间</dt><dd>'+local(r.published)+'</dd></div><div><dt>日内发布时间</dt><dd>'+(r.corrected===null?"当前截止时点不可见":local(r.correctedAt))+'</dd></div><div><dt>实发到达时间</dt><dd>'+(r.due?local(r.arrived):"尚未到达")+'</dd></div><div><dt>样本与单位</dt><dd>15 分钟区间平均功率 · MW</dd></div><div class="full"><dt>实发记录 ID</dt><dd class="small">'+(r.due&&r.recordId?esc(r.recordId):"当前时点无可见记录")+'</dd></div><div class="full"><dt>来源与版本</dt><dd>GB10 SQLite / demo-scenario-v1 / 合成场景</dd></div></dl><div class="actions"><button class="small" data-action="raw">查看同范围原始记录</button><button class="small" data-action="agent">分析此时段</button></div>';
 }else if(S.detail==="agent"){
 const residual=r.actual===null?null:r.forecast-r.actual;
 $("detail").innerHTML='<p class="small muted">Agent 交互演示 · 本地确定性摘要，未调用大模型</p><ul class="trace"><li><strong>分析范围已绑定</strong>'+station().name+" / 11 月 20 日 / "+fmt(r.i)+"–"+fmt(r.i+1)+'</li><li><strong>可直接核对的事实</strong>'+(residual===null?"当前没有有效实发，不能计算该时段误差。":"日前预测 "+num(r.forecast)+" MW，实发 "+num(r.actual)+" MW，预测减实发 "+num(residual)+" MW。")+'</li><li><strong>原因仍需证据</strong>仅凭曲线不能判定天气、设备或限电原因，需要对应观测与运行事件。</li><li><strong>可展开的工具记录</strong><details><summary>查看查询和计算范围</summary><p class="small">选择当时可见记录 → 对齐计量边界和区间 → 计算配对误差。工具输出应保留记录 ID、快照与计算版本。</p></details></li></ul><button class="small" data-detail="feedback">转为人工复核草稿</button>';
 }else{
 $("detail").innerHTML='<p class="small muted">反馈绑定当前场站、时段与版本。这里只暂存于当前原型，刷新即清空。</p><form id="feedback-form" class="feedback"><label class="field"><span>复核分类</span><select id="reason"><option>原因待查</option><option>数据质量问题</option><option>天气变化线索</option><option>设备或限电线索</option></select></label><label class="field"><span>复核说明</span><textarea id="comment" maxlength="400" required placeholder="记录已核对的事实与仍需补充的证据"></textarea></label><button class="primary" type="submit">暂存原型草稿</button><p class="small muted">正式流程：草稿 → 提交 → 人工审核 → 决定是否允许进入训练。未审核反馈不自动作为标签。</p></form>';
 }
 if(S.detail==="feedback"&&S.drafts[draftKey()]){const draft=S.drafts[draftKey()];$("reason").value=draft.reason;$("comment").value=draft.comment;}
}
function renderRaw(){
 $("content").innerHTML='<section class="panel"><div class="panel-head"><h2>当前范围的原始与预测记录</h2><button data-action="export" class="small">导出筛选结果</button></div><div class="searchline"><input id="search" type="search" placeholder="搜索时刻、状态或记录 ID" aria-label="搜索原始记录" value="'+esc(S.query)+'"><select id="quality" aria-label="数据状态"><option value="all">全部状态</option><option value="arrived">已到数</option><option value="missing">缺测</option><option value="pending">待实测</option></select><button class="small" data-action="clear-filters">清除筛选</button></div><div class="selection">继承 '+station().name+" / 11 月 20 日 / "+fmt(S.start)+"–"+fmt(S.end)+'。未来时段、零值和缺测分别显示；导出包含当前筛选全部记录，不只导出本页。</div><div id="table"></div></section><section class="panel"><div class="panel-head"><h2>记录来源</h2><button class="small" data-action="back">返回版本对比</button></div><div class="detail-tabs"><button class="small" data-detail="source">来源</button><button class="small" data-detail="agent">Agent</button><button class="small" data-detail="feedback">人工复核</button></div><div class="pad" id="detail"></div><h2 id="detail-title" hidden></h2></section>';
 $("quality").value=S.quality;renderTable();renderDetail();
}
function renderModels(){
 $("content").innerHTML='<section class="panel"><div class="panel-head"><h2>任务、版本和接入状态</h2><span class="tag">五种使用时点</span></div><div class="pad">'+[
 ["日前功率","输出次日分时功率；演示版本已入库。","合成场景 · 未训练"],
 ["日内功率修正","对固定日前基线进行滚动修正；不与同截止的模型比较混淆。","合成场景 · 未训练"],
 ["日前电价","需确认市场位置、价格类型和目标日供需输入。","供需数据待接入"],
 ["申报前价差方向","目标日两种实际价格不能作为输入。","定义与输入待核验"],
 ["日内实时价／价差","使用当时已公布的日前价和最新供需修订。","供需数据待接入"]
 ].map(x=>'<div class="list-row"><div><strong>'+x[0]+'</strong><span class="small muted">'+x[1]+'</span></div><span class="tag">'+x[2]+"</span></div>").join("")+'</div><div class="selection">正式模型比较需同时显示：任务、版本、预测时距、截止时点、输入快照、计量或价格口径、测试范围与配对数。</div></section><section class="panel"><div class="panel-head"><h2>本次复核草稿</h2><span class="tag">仅当前原型暂存</span></div><div class="pad">'+(S.feedback.length?S.feedback.map(f=>'<div class="list-row"><div><strong>'+esc(f.station)+" · "+fmt(f.index)+" · "+esc(f.reason)+'</strong><p>'+esc(f.comment)+'</p><span class="small muted">绑定日前 / 日内 10:00 版本 · 未审核 · 不可自动用于训练</span></div></div>').join(""):'<div class="empty"><h3>尚未记录复核意见</h3><p>先在曲线或表格选中一个时段，再从“人工复核”记录有依据的意见。</p><button class="small" data-action="back" style="margin-top:12px">去查看预测对比</button></div>')+'</div></section><section class="panel"><div class="panel-head"><h2>改进与发布</h2></div><div class="pad"><p>反馈记录 → 人工审核 → 候选改进 → 固定条件评估 → 审批启用 → 可回退版本。</p><div class="actions"><button disabled>发起训练 · 待接入调度</button><button disabled>发布候选 · 待接入审批</button></div><p class="small muted" style="margin:10px 0 0">目前已有存储结构；训练任务、写入权限和审批接口尚未实现，按钮不演示虚假成功。</p></div></section>';
}
const STEPS=[
 ["选任务与版本","工作台把预测表现置于首屏。日前与日内是滚动修正对比；候选模型与基线则要求同任务、同截止、同测试范围。版本不可见时说明原因。"],
 ["固定比较样本","同一计量边界、粒度和时段上取 A/B/实绩交集，显示数量、覆盖区间和排除原因。显示曲线不等于进入误差计算。"],
 ["下钻时段","点击曲线点、表格行或最大偏差按钮，同步选中时段、定位表格并展示来源。跨页保留范围，返回后恢复视图。"],
 ["查看证据与分析","Agent 继承完整范围和版本。回答引用可点击记录及工具结果；新的场站选择不覆盖旧对话，而是新建带范围标记的分析。"],
 ["记录人工复核","分类、说明、附件或证据引用与版本一起保存。自动分析只是线索；审核通过前不得用于训练或改变生产模型。"],
 ["同条件验证改进","候选使用固定数据/时距/评分方案，与基线进行配对评估。对比通过不自动发布，审批后切换并保留回退记录。"]
];
function renderDesign(){
 $("content").innerHTML='<section class="panel"><div class="panel-head"><h2>关键业务路径</h2><span class="tag">首屏：预测效果和版本对比</span></div><div class="pad"><ol class="flow">'+STEPS.map((x,i)=>'<li><button data-step="'+i+'" class="'+(S.step===i?"active":"")+'">'+(i+1)+". "+x[0]+"</button></li>").join("")+'</ol><div class="note" style="margin-top:14px"><strong>'+STEPS[S.step][0]+"</strong><p style=\"margin:6px 0 0\">"+STEPS[S.step][1]+'</p></div></div></section><section class="panel"><div class="panel-head"><h2>页面与功能范围</h2></div><div class="pad prose"><h3>一级导航</h3><p>预测工作台、原始数据、分析记录、模型管理。Agent 作为页面右侧的上下文工作区；完整历史会话归入分析记录。规则、收益和 RSI 放在具备真实输入与工具后启用的业务区域。</p><h3>任务切换</h3><p>功率下分日前预测和日内修正；价格下分日前电价、申报前价差和日内实时价差。任务切换时更新合法版本、单位、输入提示与评分指标，不能把功率和价格共用一个默认误差面板。</p><h3>时间与范围</h3><p>全局保留场站、业务日期、任务、查看模式、截止时点；页面内保留版本 A/B、时间范围、选中时段、表格筛选和排序。页面 URL 保存可分享的查询条件，浏览器返回恢复图表范围。切换站点时旧分析保留原范围，新分析使用新范围。</p><h3>价格任务</h3><p>申报前页面固定在申报截止，目标日实际日前价与实时价均不可见。日内页面才允许使用已公布日前价。价差固定定义为实时减日前，价格位置、类型和分项一同展示。方向指标与误差指标分开。</p><h3>收益、规则与交易</h3><p>规则显示来源、适用范围、版本、生效期和审核状态。收益比较需选择合同与规则口径，显示确定性计算明细。缺少真实输入时说明缺口；本阶段不提供直接交易提交或自动执行按钮。</p><h3>视觉与适配</h3><p>沿用现有深蓝、青绿的业务识别，以浅底、高密度的曲线和表格为主体。桌面采用主分析区与侧栏，窄屏把详情放在曲线下方；数值用等宽数字，状态同时显示文字，不依赖红绿辨识。</p></div></section><section class="panel"><div class="panel-head"><h2>交互状态与恢复</h2></div><div class="pad prose"><ul><li>加载：控件显示正在切换的范围；旧值明确标记为上一范围，新请求失败时不把旧指标冒充当前结果。</li><li>空数据：区分未接入、筛选无结果、版本未发布、实测未到达和无有效配对；分别给出恢复动作。</li><li>缺测与零：缺测显示破折号并断线；零值正常显示 0；未来时段显示待实测，不计入缺失率。</li><li>图表：悬停联动同一时刻，拖动缩放同步价格/功率图；选定区间统一过滤表格与指标，图例隐藏只影响视觉。</li><li>表格：列显隐、固定时段列、状态筛选、分页、来源展开；导出范围与筛选条件一并写入文件。</li><li>分析和复核：草稿有保存状态，失败保留输入并可重试；切换范围前提示草稿归属，不自动清空。</li><li>刷新：正在定位或查看历史回放时不自动跳回最新；新数据只提示可更新。历史快照保持固定。</li><li>权限：查看、反馈、启动训练和发布分别授权；没有能力或权限时给出具体原因。</li></ul></div></section><section class="panel"><div class="panel-head"><h2>后端衔接与实施顺序</h2></div><div class="pad prose"><p><strong>已有：</strong>原始记录的时点查询、预测输出查询、输入证据快照、模型/反馈/审计存储结构。</p><p><strong>需要补齐：</strong>任务与版本目录 API、服务端聚合的配对评价及排除原因、表格排序分页和导出、分析会话/反馈写入、身份权限、训练调度和审批。现有本地 Agent 只读取旧合成数据，正式迁移时须改成与页面共享同一数据库快照。</p><p><strong>先交付：</strong>统一查询范围 → 数据库驱动的版本对比 → 曲线与表格联动 → 来源详情与配对指标 → 上下文 Agent → 反馈和模型生命周期。</p><p><strong>开源复用建议：</strong>React + Ant Design ProComponents 承担布局、筛选、表格与表单，首版保留已有 Plotly 并补联动事件；不在这一轮同时重写数据库和图表引擎。正式安装前固定依赖及许可。</p><p class="small">参考：<a href="https://github.com/ant-design/pro-components/blob/master/guidelines/components/pro-table.md" target="_blank" rel="noreferrer">ProTable 官方指南</a> · <a href="https://ant.design/components/drawer/" target="_blank" rel="noreferrer">Ant Design Drawer</a>。本稿是独立交互样稿，尚未安装这些组件或替换现有前端。</p></div></section>';
}
function selectIndex(i){S.selected=i;const index=filtered().findIndex(r=>r.i===i);if(index>=0)S.pageIndex=Math.floor(index/6);if(S.page==="compare"){renderChart();renderTable();renderDetail();}else renderRaw();}
function exportText(){const list=filtered();const escape=v=>'"'+String(v??"").replaceAll('"','""')+'"';const keys=["station","mode","cutoff","time","actual_mw","forecast_mw","corrected_mw","status"];return "\ufeff"+[keys.join(","),...list.map(r=>[station().name,S.mode,S.cutoff+":00",fmt(r.i),r.actual,r.forecast,r.corrected,rowStatus(r)].map(escape).join(","))].join("\r\n");}
function download(){const csv=exportText(),url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="合成演示_当前筛选_"+S.station+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice("已按当前范围和筛选生成 CSV，共 "+filtered().length+" 条；不局限于当前页。");}
document.addEventListener("click",e=>{
 const b=e.target.closest("button,circle");if(!b)return;
 if(b.dataset.page){S.page=b.dataset.page;render();}
 else if(b.dataset.step!==undefined){S.step=Number(b.dataset.step);renderDesign();}
 else if(b.dataset.detail){S.detail=b.dataset.detail;renderDetail();}
 else if(b.dataset.index!==undefined||b.dataset.select!==undefined)selectIndex(Number(b.dataset.index??b.dataset.select));
 else if(b.dataset.action){
 const action=b.dataset.action;
 if(action==="worst"){const pool=paired();if(!pool.length){notice("当前没有可比较的实测样本，可调整版本或截止时间。");return;}const r=pool.reduce((a,b)=>Math.abs(b.forecast-b.actual)>Math.abs(a.forecast-a.actual)?b:a);S.start=Math.max(0,r.i-4);S.end=Math.min(96,r.i+5);S.selected=r.i;S.pageIndex=0;render();}
 else if(action==="reset-range"){S.start=0;S.end=96;render();}
 else if(action==="prev"){S.pageIndex=Math.max(0,S.pageIndex-1);renderTable();}
 else if(action==="next"){S.pageIndex++;renderTable();}
 else if(action==="agent"){S.detail="agent";renderDetail();}
 else if(action==="raw"){S.page="raw";render();}
 else if(action==="back"){S.page="compare";render();}
 else if(action==="export")download();
 else if(action==="clear-filters"){S.query="";S.quality="all";S.pageIndex=0;render();}
 }
});
document.addEventListener("keydown",e=>{if(e.target.tagName==="circle"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();selectIndex(Number(e.target.dataset.index));}});
document.addEventListener("change",e=>{
 const id=e.target.id;
 if(id==="station"){S.station=e.target.value;notice("已切换到 "+station().name+"，版本和时段选择保持；已有复核草稿仍归属原场站。");render();}
 else if(id==="mode"){S.mode=e.target.value;if(S.mode==="operate")S.cutoff=14;render();}
 else if(id==="cutoff"){S.cutoff=Number(e.target.value);render();}
 else if(id==="version"){S.version=e.target.value;render();}
 else if(id==="reason"){S.drafts[draftKey()]={reason:$("reason").value,comment:$("comment").value};}
 else if(id==="quality"){S.quality=e.target.value;S.pageIndex=0;renderTable();}
 else if(id==="range-start"||id==="range-end"){const next=Number(e.target.value);if((id==="range-start"&&next>=S.end)||(id==="range-end"&&next<=S.start)){notice("开始时段须早于结束时段。");e.target.value=id==="range-start"?S.start:S.end;return;}S[id==="range-start"?"start":"end"]=next;S.query="";S.quality="all";S.pageIndex=0;if(S.selected<S.start||S.selected>=S.end)S.selected=S.start;render();}
 else if(e.target.dataset.line){S.show[e.target.dataset.line]=e.target.checked;renderChart();}
});
document.addEventListener("input",e=>{if(e.target.id==="search"){S.query=e.target.value.trim();S.pageIndex=0;renderTable();}else if(e.target.id==="comment"){S.drafts[draftKey()]={reason:$("reason").value,comment:e.target.value};}});
document.addEventListener("submit",e=>{if(e.target.id!=="feedback-form")return;e.preventDefault();S.feedback.push({station:station().name,index:S.selected,reason:$("reason").value,comment:$("comment").value});delete S.drafts[draftKey()];notice("已暂存到本原型的“模型与反馈”；未写入服务器，尚未审核。");S.page="models";render();});
$("station").innerHTML=DATA.stations.map(x=>'<option value="'+x.id+'">'+x.name+" · "+x.capacity+" MW</option>").join("");
function check(){
 const saved=JSON.parse(JSON.stringify(S));const out=[];
 function assert(ok,name){if(!ok)throw Error("Prototype invariant: "+name);out.push(name);}
 assert(rows().length===96,"96 aligned intervals");
 assert(rows().filter(r=>r.actual!==null).length===55,"55 observed intervals at 14:00");
 S.mode="replay";S.cutoff=9;assert(rows().every(r=>r.corrected===null),"10:00 revision hidden at 09:00");
 assert(rows().filter(r=>r.actual!==null).length===36,"only observed values at replay time");
 S.mode="review";assert(rows().filter(r=>r.actual!==null).length===55,"review observations independent of forecast cutoff");
 S.cutoff=14;S.start=48;S.end=52;assert(paired().length===4,"matched comparison uses selected range");
 S.quality="missing";assert(filtered().length===0,"no invented missing samples in selected range");
 S.start=0;S.end=96;assert(filtered().length===1,"missing distinct from zero and future");
 assert(exportText().split("\r\n").length===2,"CSV follows filter, not current page");
 Object.assign(S,saved);return out;
}
window.prototypeChecks=check();console.log("Prototype checks passed:",JSON.stringify(window.prototypeChecks));render();
</script></body></html>
